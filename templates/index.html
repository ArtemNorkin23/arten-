<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Боулинг на Canvas</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 25% 20%, #0f172a, #020617 70%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      main {
        width: min(1040px, 100%);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(226, 232, 240, 0.12);
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        padding: 24px;
        backdrop-filter: blur(8px);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0;
        letter-spacing: 0.01em;
      }

      p {
        margin: 0;
        color: #cbd5e1;
      }

      canvas {
        width: 100%;
        aspect-ratio: 16 / 8;
        border-radius: 14px;
        border: 1px solid rgba(226, 232, 240, 0.15);
        background: linear-gradient(90deg, #3a2d2c, #6d4027 45%, #3a2d2c);
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
        display: block;
      }

      .hint {
        margin-top: 12px;
        font-size: 0.9rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Мини-игра в боулинг</h1>
        <p>Canvas + Flask · шар и 10 кеглей</p>
      </header>
      <canvas id="lane" width="960" height="480">
        Ваш браузер не поддерживает Canvas.
      </canvas>
      <p class="hint">Полотно автоматически подстраивается под плотность пикселей экрана.</p>
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
